<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="https://cdn.jsdelivr.net/gh/bubbls/ruffle@716475a57912e1ed4ac40db3a155b5e862be48ad/btts22/">

    <title>Big Tower, Tiny Square 2</title>

    <!-- Fixed favicon -->
    <link rel="icon" type="image/svg+xml"
        href="https://cdn.jsdelivr.net/gh/parinbhat23/Web-Port-Assets@629acac185a244913b54058fb3daa7d5e43872d2/Pineapple.svg">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Google Analytics (safe) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MENBM6GSNY"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }

        try {
            gtag("js", new Date());
            gtag("config", "G-MENBM6GSNY");
        } catch (e) {
            console.warn("Analytics blocked.");
        }
    </script>

    <!-- Optional Google API (kept but safe) -->
    <script src="https://www.google.com/jsapi"></script>
    <script>
        if (window.parent && window.parent.maeExportApis_) {
            window.parent.maeExportApis_();
        }
    </script>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }

        #button {
            display: none;
        }

        .imgb_vis {
            animation: imgb-animation 7s linear;
        }

        @keyframes imgb-animation {
            10% { transform: translateX(0); }
            20% { transform: translateX(100px); }
            90% { transform: translateX(100px); }
            100% { transform: translateX(0); }
        }

        #notSupportedWrap {
            color: white;
            text-align: center;
            padding: 40px;
            font-family: sans-serif;
        }
    </style>

    <!-- Construct 3 runtime -->
    <script type="module" src="c3runtime.js"></script>
</head>

<body>

    <!-- Physics engine -->
    <script src="box2d.wasm.js"></script>

    <!-- Prevent arrow keys scrolling -->
    <script>
        window.addEventListener("keydown", function (e) {
            if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
                e.preventDefault();
            }
        });
    </script>

    <!-- No JS fallback -->
    <noscript>
        <div id="notSupportedWrap">
            <h2>This content requires JavaScript</h2>
            <p>Please enable JavaScript to view this content.</p>
        </div>
    </noscript>

    <!-- Runtime scripts -->
    <script src="supportcheck.js"></script>
    <script type="module" src="offlineclient.js"></script>
    <script type="module" src="main.js"></script>
    <script type="module" src="register-sw.js"></script>

</body>

</html>
