<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Earth Taken Offline</title>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      publicPath: "https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/",
      allowScriptAccess: false,
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/parinbhat23/Web-Port-Assets@00c678c6c668f4978560dd88f4fe6eee79188551/et1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/parinbhat23/Web-Port-Assets@00c678c6c668f4978560dd88f4fe6eee79188551/et2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/parinbhat23/Web-Port-Assets@00c678c6c668f4978560dd88f4fe6eee79188551/et3.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
    }
    h1 { margin-top: 20px; }
    .game-button {
      display: block;
      margin: 15px auto;
      padding: 12px 24px;
      background: #444;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
      width: 220px;
    }
    .game-button:hover { background: #666; }
    #game-container { margin-top: 30px; }
  </style>
</head>
<body>
  <h1>Earth Taken Offline</h1>
  <button class="game-button" onclick="loadGame('ET1')">Earth Taken 1</button>
  <button class="game-button" onclick="loadGame('ET2')">Earth Taken 2</button>
  <button class="game-button" onclick="loadGame('ET3')">Earth Taken 3</button>
  <div id="game-container"></div>
  <script>
    window.addEventListener("DOMContentLoaded", function() {
      window.loadGame = function(varName) {
        const container = document.getElementById('game-container');
        container.innerHTML = '';

        const ruffle = window.RufflePlayer?.newest();
        if (!ruffle) {
          alert("Ruffle not ready.");
          return;
        }

        const b64 = window[varName.toLowerCase()];
        if (!b64) {
          alert("Game data not found for: " + varName);
          return;
        }

        const player = ruffle.createPlayer();
        player.style.width = "800px";
        player.style.height = "600px";
        container.appendChild(player);

        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        player.load({ data: bytes.buffer });
      };
    });
  </script>
</body>
</html>
